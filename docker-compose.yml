services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://pilot:change-me-in-env@postgres:5432/pilot_system
      REDIS_URL: redis://redis:6379
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pilot_system
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: change-me-in-env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
